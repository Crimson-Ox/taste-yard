<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management — Taste Yard Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-shell">

    <header class="admin-topbar">
        <a href="admin.html" class="logo">
            <span class="logo-mark">TY</span>
            <span>Admin</span>
        </a>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-menu.html" class="active">Menu</a>
            <button id="logoutBtn" class="btn btn-outline btn-small">Sign Out</button>
        </nav>
    </header>

    <main class="admin-main">

        <div class="admin-main-head">
            <div>
                <h1>Menu Management</h1>
                <p id="menuSummary" class="admin-summary">Loading…</p>
            </div>
            <button id="addNewBtn" class="btn btn-primary">+ Add New Food</button>
        </div>

        <div id="adminMenuList" class="admin-list">
            <p class="menu-loading">Loading menu…</p>
        </div>

    </main>

</div>

<!-- ADD / EDIT FORM PANEL -->
<div id="formOverlay" class="form-overlay" hidden>
    <div class="form-panel">
        <div class="form-panel-head">
            <h2 id="formTitle">Add New Food</h2>
            <button id="closeFormBtn" class="form-close">×</button>
        </div>

        <form id="itemForm">
            <input type="hidden" id="itemId">

            <div class="form-group">
                <label for="itemName">Name</label>
                <input type="text" id="itemName" required>
            </div>

            <div class="form-group">
                <label for="itemDescription">Description</label>
                <textarea id="itemDescription" rows="3"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="itemPrice">Price (₦)</label>
                    <input type="number" id="itemPrice" min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label for="itemCategory">Category</label>
                    <input type="text" id="itemCategory" required placeholder="e.g. Mains">
                </div>
            </div>

            <div class="form-group">
                <label for="itemImage">Image URL (optional)</label>
                <input type="url" id="itemImage" placeholder="https://...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="itemStatus">Status</label>
                    <select id="itemStatus">
                        <option value="available">🟢 Available</option>
                        <option value="limited">🟡 Limited</option>
                        <option value="sold_out">🔴 Sold Out</option>
                        <option value="unavailable">⚪ Unavailable</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemSortOrder">Sort Order</label>
                    <input type="number" id="itemSortOrder" value="0">
                </div>
            </div>

            <p id="formError" class="admin-auth-error" hidden></p>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                <button type="button" class="btn btn-outline" id="cancelFormBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-menu.js"></script>
<script>
    protectAdminPage();
</script>
</body>
</html>
