<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <path id="arcTop" d="M 70 150 A 130 130 0 0 1 330 150" />
  </defs>

  <!-- Badge ring -->
  <circle cx="200" cy="140" r="78" fill="#0D0D0D" stroke="#D4AF37" stroke-width="3"/>

  <!-- Chef hat -->
  <g fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 128
             C 160 128 152 118 152 106
             C 152 92 164 82 176 84
             C 178 70 190 60 202 60
             C 214 60 226 70 228 84
             C 240 82 252 92 252 106
             C 252 118 244 128 232 128
             L 232 150 L 172 150 Z"/>
    <line x1="166" y1="150" x2="238" y2="150"/>
  </g>

  <!-- Crossed fork and spoon -->
  <g stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="178" y1="168" x2="222" y2="205"/>
    <line x1="175" y1="172" x2="181" y2="164"/>
    <line x1="181" y1="176" x2="187" y2="168"/>

    <path d="M222 168 C 230 172 230 182 224 188 L 218 205" />
  </g>

  <!-- Wordmark arched -->
  <text font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">TASTE</textPath>
  </text>

  <text x="200" y="270" font-family="Georgia, serif" font-size="56" font-weight="700"
        letter-spacing="4" fill="#D4AF37" text-anchor="middle">YARD</text>

  <text x="200" y="300" font-family="Georgia, serif" font-style="italic" font-size="20"
        fill="#D4AF37" text-anchor="middle">by Millennium</text>

  <line x1="90" y1="326" x2="165" y2="326" stroke="#D4AF37" stroke-width="1"/>
  <line x1="235" y1="326" x2="310" y2="326" stroke="#D4AF37" stroke-width="1"/>

  <text x="200" y="331" font-family="Georgia, serif" font-size="14" letter-spacing="3"
        fill="#B0B0B0" text-anchor="middle"> </text>
</svg>