<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Info — Taste Yard Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-shell">

    <header class="admin-topbar">
        <a href="admin.html" class="logo">
            <span class="logo-mark">TY</span>
            <span>Admin</span>
        </a>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-menu.html">Menu</a>
            <a href="admin-settings.html" class="active">Settings</a>
            <button id="logoutBtn" class="btn btn-outline btn-small">Sign Out</button>
        </nav>
    </header>

    <main class="admin-main" style="max-width: 640px;">

        <div class="admin-main-head">
            <div>
                <h1>Restaurant Info</h1>
                <p class="admin-summary">Changes here update the live site immediately.</p>
            </div>
        </div>

        <form id="settingsForm">
            <div class="form-group">
                <label for="s-name">Restaurant Name</label>
                <input type="text" id="s-name" required>
            </div>

            <div class="form-group">
                <label for="s-description">Description / Tagline</label>
                <textarea id="s-description" rows="3"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="s-whatsapp">WhatsApp / Order Number</label>
                    <input type="text" id="s-whatsapp" required placeholder="2348024516884">
                </div>
                <div class="form-group">
                    <label for="s-phone">Phone Number</label>
                    <input type="text" id="s-phone">
                </div>
            </div>

            <div class="form-group">
                <label for="s-address">Address</label>
                <input type="text" id="s-address">
            </div>

            <div class="form-group">
                <label for="s-location">Google Maps Link</label>
                <input type="url" id="s-location" placeholder="https://maps.google.com/...">
            </div>

            <div class="form-group">
                <label for="s-hours">Opening Hours</label>
                <input type="text" id="s-hours" placeholder="e.g. 11am – 10pm daily">
            </div>

            <div class="form-group">
                <label for="s-delivery">Delivery / Pickup Info</label>
                <textarea id="s-delivery" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label>Restaurant Status</label>
                <div class="fulfillment-toggle" style="display:flex; gap:10px;">
                    <label style="flex:1; text-align:center; padding:13px; border:1px solid var(--border, rgba(243,233,216,0.15)); border-radius:6px; cursor:pointer;">
                        <input type="radio" name="s-status" value="open" style="margin-right:6px;"> 🟢 Open
                    </label>
                    <label style="flex:1; text-align:center; padding:13px; border:1px solid var(--border, rgba(243,233,216,0.15)); border-radius:6px; cursor:pointer;">
                        <input type="radio" name="s-status" value="closed" style="margin-right:6px;"> 🔴 Closed
                    </label>
                </div>
            </div>

            <p id="formError" class="admin-auth-error" hidden></p>
            <p id="formSuccess" class="admin-auth-error" style="background:rgba(107,142,90,0.15); color:#8AC98A;" hidden></p>

            <button type="submit" class="btn btn-primary" id="saveBtn" style="width:100%;">Save Changes</button>
        </form>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-settings.js"></script>
<script>
    protectAdminPage();
</script>
</body>
</html>
